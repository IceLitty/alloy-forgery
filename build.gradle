//file:noinspection GradlePackageVersionRange
plugins {
//    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
    id 'net.neoforged.gradle.mixin' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${project.mod_version}+${project.minecraft_base_version}"
group = project.maven_group

def ENV = System.getenv()

repositories {
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.wispforest.io' }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup "maven.modrinth" }
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral() // MixinExtras is there
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
//    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    compileOnly ("me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}")
    compileOnly ("me.shedaniel:RoughlyEnoughItems-default-plugin:${project.rei_version}")
    compileOnly ("me.shedaniel.cloth:basic-math:0.6.1")

//    runtimeOnly ("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
//    runtimeOnly ("dev.architectury:architectury-fabric:${project.arch_api_version}") { exclude(module: "fabric-api") }

//    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    annotationProcessor implementation("io.wispforest:owo-lib:${project.owo_version}")
    implementation(jarJar("io.wispforest:owo-sentinel:${project.owo_version}"))

    compileOnly ("dev.emi:emi-neoforge:${emi_version}")
//    runtimeOnly ("dev.emi:emi-fabric:${emi_version}")

//    runtimeOnly ("maven.modrinth:spark:1.10.53-fabric")

//    runtimeOnly ("net.fabricmc:fabric-language-kotlin:1.10.10+kotlin.1.9.10")
//    runtimeOnly ("maven.modrinth:architectury-api:9.1.12+fabric")
//
//    runtimeOnly ("maven.modrinth:observable:4.4.0+fabric")

//    implementation ('com.blamejared.crafttweaker:CraftTweaker-fabric-1.20.4:17.0.12')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

mixin {
    config "alloy-forgery.mixins.json"
}

runs {
    client {
        workingDirectory project.file('runs/client')
        jvmArgs "-Dmixin.debug.export=true"
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        programArguments.addAll '--username', 'Dev'
        dependencies {
//            runtime("curse.maven:jei-238222:5846880")
//            runtime("mezz.jei:jei-1.21.1-neoforge:19.21.0.247")
        }
    }

    server {
        workingDirectory project.file('runs/server')
        programArgument '--nogui'
        systemProperty 'mixin.env.disableRefMap', 'true'
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    }

    data {
        workingDirectory project.file('runs/data')
        systemProperty 'mixin.env.disableRefMap', 'true'
        programArguments.addAll '--mod', 'alloy-forgery', '--all', '--output', file('src/generated/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated_resources'
            ]
        }
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("neoforge.mods.toml") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    archivesBaseName = project.archives_base_name
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url ENV.MAVEN_URL
            credentials {
                username ENV.MAVEN_USER
                password ENV.MAVEN_PASSWORD
            }
        }
    }
}